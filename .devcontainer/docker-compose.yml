name: raider-backend
services:
  workspace:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: .env
    volumes: 
      - ../..:/workspace
    command: sleep infinity

  litellm:
    build:
      context: ../litellm
      dockerfile: Dockerfile
    restart: always
    depends_on:
    - postgres-db
    volumes:
      - ../litellm/config.yaml:/app/config.yaml
    ports:
      - 4000:4000
    environment:
        DATABASE_URL: "postgresql://llmproxy:dbpassword9090@postgres-db:5432/litellm"
        STORE_MODEL_IN_DB: "True"
    env_file: .env

  postgres-db:
    image: postgres
    restart: always
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: llmproxy
      POSTGRES_PASSWORD: dbpassword9090
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d litellm -U llmproxy"]
      interval: 1s
      timeout: 5s
      retries: 10